[project]
name = "oncall-sre-agent"
version = "0.1.0"
description = "Multi-agent on-call SRE: triage, investigate, propose a fix, wait for human approval"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
live = ["litellm>=1.50", "mcp"]
aws = ["boto3>=1.34", "mangum>=0.17"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
